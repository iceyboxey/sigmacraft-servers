<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>3D Sandbox</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    overflow: hidden; background: #000; touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; font-family: Arial, sans-serif;
  }
  canvas { display: block; touch-action: none; }
  #info {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    color: white; font-size: 13px; max-width: 94vw;
    background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 8px;
    text-align: center; pointer-events: none;
  }
  #crosshair {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: white; font-size: 24px; pointer-events: none; text-shadow: 0 0 3px #000;
  }
  #inv {
    position: fixed; right: 10px; bottom: 10px; display: none; flex-direction: column; gap: 5px;
    background: rgba(0,0,0,0.5); padding: 6px; border-radius: 10px; z-index: 60; max-height: 78vh; overflow: hidden; flex-wrap: wrap; align-content: flex-end;
  }
  #uw { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 55; }
  #craft {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(94vw, 480px); max-height: 82vh; overflow-y: auto;
    background: rgba(20,24,34,0.96); color: #fff; border-radius: 14px; padding: 16px; z-index: 210; display: none; touch-action: pan-y;
  }
  #craft h2 { font-size: 20px; margin-bottom: 4px; text-align: center; }
  #craft .stn { font-size: 12px; color: #9ab; text-align: center; margin-bottom: 10px; }
  .crow { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.06); border-radius: 8px; padding: 6px 8px; margin-bottom: 6px; }
  .crow canvas { width: 36px; height: 36px; image-rendering: pixelated; flex: none; }
  .crow .ct { flex: 1; min-width: 0; font-size: 14px; } .crow .ct small { display: block; color: #aab; font-size: 11px; } .crow .ct small .no { color: #ff7a7a; }
  .crow button { padding: 6px 12px; border: none; border-radius: 6px; background: #3a9b4a; color: #fff; font-size: 13px; cursor: pointer; }
  .crow button:disabled { background: #444; color: #888; cursor: default; }
  #drop-btn, #trash-btn { display: none; position: fixed; top: 52px; background: rgba(0,0,0,0.6); color: white; border: none; border-radius: 8px; padding: 8px 14px; font-size: 20px; cursor: pointer; z-index: 100; }
  #drop-btn { left: 70px; } #trash-btn { left: 120px; }
  body.touch #drop-btn, body.touch #trash-btn { display: block; }
  #chatlog { position: fixed; left: 10px; bottom: 120px; max-width: min(520px, 62vw); z-index: 90; pointer-events: none; font: 14px sans-serif; color: #fff; text-shadow: 0 0 3px #000; }
  #chatlog div { background: rgba(0,0,0,0.45); padding: 2px 7px; margin-top: 2px; border-radius: 4px; word-break: break-word; }
  #chatlog b { color: #9fd0ff; }
  #chatbar { display: none; position: fixed; left: 10px; bottom: 80px; width: min(560px, 80vw); z-index: 200; gap: 6px; }
  #chatbar input { flex: 1; min-width: 0; padding: 10px 12px; font-size: 16px; border-radius: 8px; border: none; outline: 2px solid #fff6; }
  #chatbar button { border: none; border-radius: 8px; padding: 0 14px; font-size: 20px; background: #2d7d46; color: #fff; cursor: pointer; }
  #chatbar #chat-x { background: #555; }
  #talk { position: fixed; left: 10px; top: 96px; z-index: 90; pointer-events: none; font: 14px sans-serif; color: #fff; text-shadow: 0 0 3px #000; white-space: pre; }
  body.touch #chatbar { top: 8px; bottom: auto; left: 8px; right: 8px; width: auto; }
  body.touch #chatbar input { padding: 12px; }
  body.touch #chatbar button { padding: 0 18px; font-size: 22px; }
  body.touch #chatlog { bottom: auto; top: 140px; max-width: 58vw; font-size: 13px; }
  body.touch #talk { top: 112px; }
  body.touch #chat-btn, body.touch #mic-btn, body.touch #drop-btn, body.touch #trash-btn { padding: 10px 14px; }
  #chat-btn, #mic-btn { position: fixed; top: 52px; background: rgba(0,0,0,0.6); color: white; border: none; border-radius: 8px; padding: 8px 14px; font-size: 20px; cursor: pointer; z-index: 100; }
  #chat-btn { left: 220px; } #mic-btn { left: 170px; opacity: 0.6; } #mic-btn.on { opacity: 1; background: rgba(170,30,30,0.85); }
  #craft-btn { position: fixed; top: 10px; left: 70px; background: rgba(0,0,0,0.6); color: white; border: none; border-radius: 8px; padding: 8px 14px; font-size: 20px; cursor: pointer; z-index: 100; }
  #inv .hint { color: #cde; font-size: 12px; max-width: 120px; text-align: center; padding: 4px 2px; }
  .slot {
    position: relative; width: 44px; height: 44px; border-radius: 6px;
    border: 2px solid rgba(255,255,255,0.3); cursor: pointer; overflow: hidden;
  }
  .slot canvas { width: 100%; height: 100%; image-rendering: pixelated; }
  .slot span.n { top: auto; left: auto; bottom: 1px; right: 4px; font-size: 14px; font-weight: 700; }
  .slot span {
    position: absolute; top: 1px; left: 3px; color: #fff; font-size: 10px;
    text-shadow: 0 0 3px #000, 0 0 3px #000; pointer-events: none;
  }
  .slot.active { border: 2px solid white; box-shadow: 0 0 8px rgba(255,255,255,0.8); }
  #perf {
    position: fixed; top: 10px; right: 10px; color: #0f0; font-family: monospace; font-size: 12px;
    background: rgba(0,0,0,0.5); padding: 6px 10px; border-radius: 6px; pointer-events: none;
  }
  #settings-btn {
    position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.6); color: white;
    border: none; border-radius: 8px; padding: 8px 14px; font-size: 20px; cursor: pointer; z-index: 100;
  }
  #settings-btn:hover { background: rgba(255,255,255,0.2); }
  #settings-panel {
    display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(20,20,30,0.97); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px; padding: 24px 28px; z-index: 200; color: white;
    width: min(440px, 94vw); max-height: 92vh; overflow-y: auto;
    box-shadow: 0 8px 40px rgba(0,0,0,0.7); touch-action: pan-y;
  }
  #settings-panel h2 { font-size: 22px; margin-bottom: 20px; text-align: center; }
  .setting-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; gap: 12px; }
  .setting-row label { font-size: 15px; color: #ccc; min-width: 130px; }
  .setting-row input[type=range] { flex: 1; accent-color: #4CAF50; }
  .setting-row select {
    flex: 1; background: #2a2a3e; color: white; border: 1px solid rgba(255,255,255,0.2);
    border-radius: 6px; padding: 5px 8px; font-size: 14px;
  }
  .setting-val { min-width: 70px; text-align: right; color: #4CAF50; font-weight: bold; font-size: 13px; }
  .setting-row input[type=checkbox] { width: 22px; height: 22px; accent-color: #4CAF50; margin-right: auto; margin-left: 4px; }
  .btn-row { display: flex; gap: 10px; flex: 1; }
  .btn-row button {
    flex: 1; padding: 9px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
    background: #2a2a3e; color: white; font-size: 14px; cursor: pointer;
  }
  .btn-row button:hover { background: #3a3a5e; }
  .skin-b { background: #3b4152; color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; padding: 7px 8px; font-size: 13px; cursor: pointer; }
  .skin-b:hover { background: #4a5270; }
  #close-settings {
    display: block; width: 100%; margin-top: 14px; padding: 11px; border-radius: 8px; border: none;
    background: #4CAF50; color: white; font-size: 16px; font-weight: bold; cursor: pointer;
  }
  #close-settings:hover { background: #388e3c; }
  #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 150; }
  #daytime {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
    color: white; font-size: 14px; background: rgba(0,0,0,0.5); padding: 6px 16px; border-radius: 20px;
    pointer-events: none; display: flex; align-items: center; gap: 8px;
  }
  #daytime-bar { width: 100px; height: 8px; background: rgba(255,255,255,0.2); border-radius: 4px; overflow: hidden; }
  #daytime-fill { height: 100%; width: 50%; background: #FFD700; border-radius: 4px; }
  #hpbar { position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; pointer-events: none; }
  .heart { font-size: 22px; }
  #toast {
    position: fixed; top: 96px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 16px; font-weight: bold;
    background: rgba(0,0,0,0.65); padding: 8px 18px; border-radius: 10px; display: none; pointer-events: none; z-index: 120; max-width: 90vw; text-align: center;
  }
  #vr-btn {
    position: fixed; top: 10px; left: 126px; background: rgba(0,0,0,0.6); color: white; display: none;
    border: none; border-radius: 8px; padding: 8px 14px; font-size: 20px; cursor: pointer; z-index: 100;
  }
  #warning {
    position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
    color: #ff4444; font-size: 16px; font-weight: bold; background: rgba(0,0,0,0.6);
    padding: 6px 16px; border-radius: 8px; display: none; pointer-events: none; white-space: nowrap;
  }
  #gameover {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 300;
    flex-direction: column; align-items: center; justify-content: center; color: white;
  }
  #gameover h1 { font-size: 48px; color: #ff4444; margin-bottom: 20px; }
  #gameover button { padding: 12px 32px; font-size: 18px; border-radius: 10px; border: none; background: #4CAF50; color: white; cursor: pointer; }

  /* ---------- Lobby ---------- */
  #lobby {
    display: flex; position: fixed; inset: 0; z-index: 250; align-items: center; justify-content: center;
    background: linear-gradient(rgba(10,14,30,0.5), rgba(10,14,30,0.82)); color: #fff;
    padding: 12px; overflow-y: auto; touch-action: pan-y;
  }
  .lb-card {
    width: min(540px, 100%); max-height: calc(100vh - 24px); overflow-y: auto; touch-action: pan-y;
    background: rgba(20,20,30,0.96); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px; padding: 22px 24px; box-shadow: 0 8px 40px rgba(0,0,0,0.7);
  }
  .lb-card h1 { font-size: 26px; text-align: center; margin-bottom: 4px; }
  .lb-sub { text-align: center; color: #aaa; font-size: 14px; margin-bottom: 14px; }
  .lb-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .lb-row label { font-size: 14px; color: #ccc; min-width: 70px; }
  .lb-card input[type=text], .lb-card input:not([type]), .lb-card select {
    flex: 1; min-width: 0; background: #2a2a3e; color: #fff; border: 1px solid rgba(255,255,255,0.2);
    border-radius: 6px; padding: 8px 10px; font-size: 14px;
  }
  .lb-card button {
    padding: 8px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
    background: #2a2a3e; color: #fff; font-size: 14px; cursor: pointer;
  }
  .lb-card button:hover:not(:disabled) { background: #3a3a5e; }
  .lb-card button:disabled { opacity: 0.4; cursor: default; }
  .lb-card button.primary { background: #4CAF50; border: none; font-weight: bold; }
  .lb-card button.primary:hover:not(:disabled) { background: #388e3c; }
  #lb-status { font-size: 13px; margin: 2px 0 6px; }
  #lb-msg { color: #ff6666; font-size: 14px; min-height: 18px; margin-bottom: 4px; }
  .lb-title { font-size: 13px; color: #9ab; text-transform: uppercase; letter-spacing: 1px; margin: 12px 0 6px; }
  #lb-list { max-height: 220px; overflow-y: auto; margin-bottom: 4px; touch-action: pan-y; }
  .lb-room { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.06); border-radius: 8px; padding: 7px 10px; margin-bottom: 6px; }
  .lb-rn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-rc { color: #8c8; font-size: 13px; }
  .lb-empty { color: #888; font-size: 14px; padding: 6px 2px; }

  /* ---------- Touch UI ---------- */
  #touch-ui { display: none; }
  body.touch #touch-ui { display: block; }
  body.touch #info { display: none; }
  body.touch #inv { bottom: auto; top: 86px; right: 8px; padding: 4px; gap: 4px; }
  body.touch .slot { width: 38px; height: 38px; }
  body.touch #hpbar { bottom: 14px; }
  body.touch .heart { font-size: 18px; }
  body.touch #warning { top: 100px; font-size: 14px; }
  body.touch #perf { top: 52px; font-size: 10px; padding: 3px 6px; }
  body.touch #crosshair { font-size: 20px; }
  #joy-base {
    position: fixed; left: 26px; bottom: 56px; width: 130px; height: 130px; border-radius: 50%;
    background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.3); z-index: 50; touch-action: none;
  }
  #joy-knob {
    position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px;
    border-radius: 50%; background: rgba(255,255,255,0.4); pointer-events: none;
  }
  .tbtn {
    position: fixed; width: 66px; height: 66px; border-radius: 50%;
    background: rgba(0,0,0,0.45); border: 2px solid rgba(255,255,255,0.4);
    font-size: 28px; display: flex; align-items: center; justify-content: center;
    z-index: 50; touch-action: none; color: white;
  }
  .tbtn.down { background: rgba(255,255,255,0.35); }
  #btn-jump  { right: 22px;  bottom: 44px; width: 74px; height: 74px; }
  #btn-break { right: 22px;  bottom: 134px; }
  #btn-place { right: 104px; bottom: 96px; }
  #btn-spawn { right: 104px; bottom: 20px; width: 52px; height: 52px; font-size: 22px; }
  @media (max-width: 520px) { .setting-row label { min-width: 100px; font-size: 14px; } }
</style>
</head>
<body>
<div id="crosshair">+</div>
<div id="inv"></div>
<div id="daytime">
  <span id="daytime-icon">☀️</span>
  <div id="daytime-bar"><div id="daytime-fill"></div></div>
  <span id="daytime-label" data-i18n="day">Day</span>
</div>
<div id="hpbar"></div>
<div id="warning" data-i18n="warning"></div>
<div id="info"></div>
<div id="perf">FPS: --</div>
<button id="settings-btn">⚙️</button>
<div id="chatlog"></div>
<div id="chatbar"><input id="chat-in" maxlength="120" placeholder="Type a message…" enterkeyhint="send" autocomplete="off" autocorrect="off"><button id="chat-send">➤</button><button id="chat-x">✕</button></div>
<div id="talk"></div>
<button id="chat-btn">💬</button><button id="mic-btn">🎤</button>
<button id="craft-btn">🔨</button>
<button id="drop-btn">⬇</button><button id="trash-btn">🗑</button>
<button id="vr-btn">🥽 VR</button>
<div id="uw"></div>
<div id="craft"></div>
<div id="toast"></div>
<div id="overlay"></div>

<div id="settings-panel">
  <h2 data-i18n="settings">⚙️ Settings</h2>
  <div class="setting-row">
    <label data-i18n="lang">🌐 Language</label>
    <select id="s-lang">
      <option value="en">English</option>
      <option value="de">Deutsch</option>
    </select>
  </div>
  <div class="setting-row">
    <label data-i18n="renderdist">🌍 Render distance</label>
    <input type="range" id="s-renderdist" min="2" max="50" step="1" value="50">
    <span class="setting-val" id="v-renderdist"></span>
  </div>
  <div class="setting-row">
    <label data-i18n="fog">🌫️ Fog</label>
    <input type="range" id="s-fog" min="20" max="800" step="10" value="60">
    <span class="setting-val" id="v-fog">60m</span>
  </div>
  <div class="setting-row">
    <label data-i18n="touch">📱 Touch controls</label>
    <input type="checkbox" id="s-touch">
  </div>
  <div class="setting-row">
    <label data-i18n="mp_name">👤 Name</label>
    <input type="text" id="s-name" maxlength="16" style="flex:1;background:#2a2a3e;color:white;border:1px solid rgba(255,255,255,0.2);border-radius:6px;padding:6px 8px;font-size:14px;">
  </div>
  <div class="setting-row">
    <label data-i18n="mp_status">🌐 Multiplayer</label>
    <span class="setting-val" id="v-mp" style="flex:1;text-align:right"></span>
  </div>
  <div style="border-top:1px solid rgba(255,255,255,0.15);margin-top:6px;padding-top:12px">
    <div class="setting-row"><label>🎨 Skin</label></div>
    <div style="display:flex;gap:10px;align-items:center">
      <canvas id="skin-prev" width="8" height="8" style="width:64px;height:64px;image-rendering:pixelated;background:#222;border-radius:6px;flex:0 0 auto"></canvas>
      <div style="flex:1;display:flex;flex-direction:column;gap:6px">
        <button id="skin-up" class="skin-b">📁 Upload skin (PNG 64×64)</button>
        <button id="skin-blue" class="skin-b" style="display:none">💙 Blue skin (admin)</button>
        <button id="skin-reset" class="skin-b">↺ Default (Steve)</button>
      </div>
    </div>
    <input type="file" id="skin-file" accept="image/png" style="display:none">
    <div id="skin-msg" style="font-size:12px;color:#aab;margin-top:4px;min-height:14px"></div>
  </div>
  <div id="admin-section" style="display:none;border-top:1px solid rgba(255,255,255,0.15);margin-top:6px;padding-top:14px">
    <div class="setting-row">
      <label data-i18n="adm_title">🛡️ Admin</label>
      <input type="password" id="adm-pw" autocomplete="off" style="flex:1;min-width:0;background:#2a2a3e;color:white;border:1px solid rgba(255,255,255,0.2);border-radius:6px;padding:6px 8px;font-size:14px;">
      <div class="btn-row" style="flex:0 0 auto"><button id="adm-login" data-i18n="adm_login">Login</button></div>
    </div>
    <div class="setting-row">
      <span class="setting-val" id="v-adm" style="flex:1;text-align:left;color:#aaa"></span>
      <div class="btn-row"><button id="adm-reset" data-i18n="adm_reset" style="background:#7a2222;display:none">🗑️ Reset world</button></div>
    </div>
  </div>
  <div style="font-size:11px;color:#889;margin-top:10px;text-align:center;line-height:1.5">
    <a data-i18n="credit" href="https://sketchfab.com/3d-models/minecraft-steve-cb228dcc137042cc9a3dc588758cc6e9" target="_blank" rel="noopener noreferrer" style="color:#9ab">Player model: "Minecraft - Steve" by Vincent Yanez</a>
    · <a href="http://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer" style="color:#9ab">CC BY 4.0</a>
  <br><a href="https://sketchfab.com/3d-models/minecraft-zombie-45037ec52b6a4444a0981f916d0dbd43" target="_blank" rel="noopener noreferrer" style="color:#9ab">Zombie model: "minecraft zombie" by JoohnElkes</a> · <a href="http://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer" style="color:#9ab">CC BY 4.0</a>
  </div>
  <button id="close-settings" data-i18n="close">✅ Close</button>
</div>

<div id="touch-ui">
  <div id="joy-base"><div id="joy-knob"></div></div>
  <div class="tbtn" id="btn-jump">⬆️</div>
  <div class="tbtn" id="btn-break">⛏️</div>
  <div class="tbtn" id="btn-place">🧱</div>
  <div class="tbtn" id="btn-spawn">📦</div>
</div>

<div id="lobby">
  <div class="lb-card">
    <h1 data-i18n="lb_title">🌍 3D Sandbox</h1>
    <div class="lb-sub" data-i18n="lb_sub">Joining the world…</div>
    <div class="lb-row"><label data-i18n="mp_name">👤 Name</label><input type="text" id="lb-name" maxlength="16" autocomplete="off">
      <select id="lb-lang" style="flex:0 0 auto"><option value="en">English</option><option value="de">Deutsch</option></select></div>
    <div id="lb-status"></div>
    <div id="lb-msg"></div>
    <div id="lb-diag" style="font-size:12px;color:#889;margin:0 0 12px;word-break:break-all"></div>
    <button id="lb-offline" style="width:100%" data-i18n="lb_offline">Play offline</button>
  </div>
</div>
<div id="gameover">
  <h1 data-i18n="gameover">💀 Game Over</h1>
  <p id="go-txt" style="margin-bottom:24px;font-size:18px;color:#aaa" data-i18n="gameover_txt">The monsters got you!</p>
  <button id="restart-btn" data-i18n="restart">🔄 Play again</button>
</div>
<canvas id="c"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// =====================================================
// LANGUAGES (English = default)
// =====================================================
const I18N = {
  en: {
    settings:'⚙️ Settings', lang:'🌐 Language', time:'🕐 Time of day', set_day:'☀️ Day', set_night:'🌙 Night',
    renderdist:'🌍 Render distance', chunks:'chunks', shadows:'☀️ Shadows',
    sh_off:'Off', sh_low:'Low', sh_medium:'Medium', sh_high:'High',

  ambientLight.intensity = 0.5 + 0.12 * nightMix;
  cloudMat.color.lerpColors(CLOUD_DAY, CLOUD_NIGHT, nightMix);

  // sun / moon position on an arc
  const a = dayT * Math.PI;
  _off.set(Math.cos(a) * 60, Math.max(Math.sin(a) * 80, 10), 20);
  shadowTarget.position.set(Math.round(player.pos.x / 4) * 4, 0, Math.round(player.pos.z / 4) * 4);
  dirLight.position.copy(shadowTarget.position).add(_off);
  _off.normalize().multiplyScalar(105);
  sunMesh.visible = !isNight;
  moonMesh.visible = isNight;
  (isNight ? moonMesh : sunMesh).position.copy(camPos()).add(_off);
  starsMat.opacity = nightMix * 0.9;
  stars.visible = nightMix > 0.01;
  stars.position.copy(camPos());

  // clouds
  cloudT += dt;
  const drift = cloudT * 1.5;
  for (const c of clouds) c.g.position.set(camPos().x + wrap(c.x + drift - camPos().x), 52, camPos().z + wrap(c.z - camPos().z));
}

const el = id => document.getElementById(id);
let lastIcon = '', lastLabelKey = '', lastFill = -1;
function updateHud(force) {
  const icon = isNight ? '🌙' : (dayTG < 0.1 || dayTG > 0.9 ? '🌅' : '☀️');
  if (icon !== lastIcon || force) { el('daytime-icon').textContent = icon; lastIcon = icon; }
  const key = isNight ? 'night' : 'day';
  if (key !== lastLabelKey || force) {
    el('daytime-label').textContent = t(key); lastLabelKey = key;
    el('daytime-fill').style.background = isNight ? '#4466ff' : '#FFD700';
  }
  const fill = Math.round(dayTG * 100);
  if (fill !== lastFill || force) { el('daytime-fill').style.width = fill + '%'; lastFill = fill; }
}
function updateHpBar() {
  vrDirty = true;
  const hp = el('hpbar'); hp.innerHTML = '';
  for (let i = 0; i < player.maxHp; i++) {
    const h = document.createElement('span'); h.className = 'heart';
    h.textContent = i < player.hp ? '❤️' : '🖤'; hp.appendChild(h);
  }
}
let warnShown = false;
function setWarn(v) { if (v !== warnShown) { el('warning').style.display = v ? 'block' : 'none'; warnShown = v; } }
function updateInfo() { el('info').textContent = t(touchMode ? 'info_touch' : 'info_desktop'); }

let deathT = 0;
const deathF = () => Math.min(1, deathT * 3);
function takeDamage(by) {
  if (player.invincible > 0 || !player.alive) return;
  player.hp--; player.invincible = 1.5; player.regen = 0;
  updateHpBar();
  const flash = document.createElement('div');
  flash.style.cssText = 'position:fixed;inset:0;background:rgba(255,0,0,0.3);pointer-events:none;z-index:99;transition:opacity 0.5s';
  document.body.appendChild(flash);
  setTimeout(() => { flash.style.opacity = '0'; setTimeout(() => flash.remove(), 500); }, 100);
  if (player.hp <= 0) {
    player.alive = false; netSend({ t: 'died' });
    el('go-txt').textContent = by === 'lava' ? t('gameover_lava') : by ? t('gameover_pvp').replace('{n}', by) : t('gameover_txt');
    el('gameover').style.display = 'flex';
    if (locked) document.exitPointerLock();
  }
}
function restartGame() {
  player.hp = player.maxHp; player.alive = true; player.invincible = 0; netSend({ t: 'alive' });
  for (let i = monsters.length - 1; i >= 0; i--) removeMonster(i);
  if (netState !== 'on') cycleTime = 0;     // online, the time of day belongs to the server
  touch.jump = false; touch.breakHeld = false; kb.x = kb.z = 0;
  el('go-txt').textContent = t('gameover_txt');
  respawnPlayer();
  el('gameover').style.display = 'none';
  setWarn(false); updateHpBar(); updateHud(true);
}

      if (isSolidId(getBlock(Math.round(d.x), Math.round(d.y), Math.round(nz)))) d.vz = 0; else d.z = nz;

  const l = Math.hypot(dx, dy); if (l > 1) { dx /= l; dy /= l; }

  for (const tc of e.changedTouches) if (touch.lookId === null) { touch.lookId = tc.identifier; touch.lx = tc.clientX; touch.ly = tc.clientY; }

// =====================================================
// WORLD BACKUP IN THE BROWSER
// Every player keeps a copy of all block changes (IndexedDB). When the server has lost some of them
// (e.g. Render restarted), the player hands them over on joining, so the one shared world comes back.
// Each change has a server timestamp; the newest change per block always wins.
// =====================================================
const bk = new Map();              // numeric block key -> ts * 64 + block id
const serverSeen = new Map();      // what the server has told us this session: key -> ts
let bkDirty = false, bkSaveT = null, clockOff = 0, srvReset = 0, knownReset = 0, upT = null;
const bkKey = (x, y, z) => ((x + 30000) * 60001 + (z + 30000)) * 128 + (y + 64);        // y -64..63
function bkDecode(k) {
  const y = (k % 128) - 64, r = (k - (k % 128)) / 128, z = (r % 60001) - 30000, x = (r - (r % 60001)) / 60001 - 30000;
  return [x, y, z];
}
function bkDecodeV1(k) {                                  // the first version of the local backup used 64 slots for y and ts * 16 + id
  const y = (k % 64) - 16, r = (k - (k % 64)) / 64, z = (r % 60001) - 30000, x = (r - (r % 60001)) / 60001 - 30000;
  return [x, y, z];
}
const bkValid = (x, y, z) => Number.isInteger(x) && Number.isInteger(y) && Number.isInteger(z) &&
  x >= -30000 && x <= 30000 && z >= -30000 && z <= 30000 && y >= Y_MIN && y < Y_MIN + Y_H;
function bkSet(x, y, z, b, ts) { if (bkValid(x, y, z)) { bk.set(bkKey(x, y, z), ts * 64 + b); bkTouch(); } }
function bkTouch() { bkDirty = true; if (!bkSaveT) bkSaveT = setTimeout(bkSave, 4000); }

function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('sbx_world', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
function bkSave() {
  bkSaveT = null; if (!bkDirty) return; bkDirty = false;
  const n = bk.size, k = new Float64Array(n), v = new Float64Array(n); let i = 0;
  for (const [a, b] of bk) { k[i] = a; v[i++] = b; }
  idbOpen().then(db => {
    const tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').put({ k, v, r: knownReset, ver: 2 }, 'bk');
    tx.oncomplete = () => db.close(); tx.onerror = () => { bkDirty = true; db.close(); };
  }).catch(() => { /* private mode etc.: the game works without a local backup */ });
}
async function bkLoad() {
  try {
    const db = await idbOpen();
    const rec = await new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get('bk'); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
    db.close();
    if (rec && rec.k && rec.v && rec.k.length === rec.v.length) {
      knownReset = Number.isFinite(rec.r) ? rec.r : 0;
      const list = [];
      const old = rec.ver !== 2;                                // convert an older local backup
      for (let i = 0; i < rec.k.length; i++) {
        const [x, y, z] = old ? bkDecodeV1(rec.k[i]) : bkDecode(rec.k[i]);
        if (!bkValid(x, y, z) || !Number.isFinite(rec.v[i])) continue;
        const v = old ? Math.floor(rec.v[i] / 16) * 64 + (rec.v[i] % 16) : rec.v[i];
        bk.set(bkKey(x, y, z), v); list.push([x, y, z, v % 64]);
      }
      if (list.length) applyEdits(list);         // show the saved world right away
    }
  } catch (e) { /* no IndexedDB: fine */ }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) bkSave(); });
window.addEventListener('pagehide', bkSave);

function bkDropBefore(r) {                      // a reset happened that we did not know about
  let n = 0;
  for (const [k, v] of [...bk]) if (Math.floor(v / 64) < r) { bk.delete(k); n++; }
  if (!n) return;
  chunkEdits.clear();
  const list = []; for (const [k, v] of bk) { const [x, y, z] = bkDecode(k); list.push([x, y, z, v % 64]); }
  applyEdits(list); reloadWorld(); bkTouch();
}
function bkFromServer(list) {                    // edits from the server: the newest timestamp wins
  const apply = [];
  for (const e of list) {
    if (!Array.isArray(e) || e.length < 4) continue;
    const x = e[0], y = e[1], z = e[2], b = e[3], ts = Number.isFinite(e[4]) ? e[4] : 0;
    if (!bkValid(x, y, z) || !Number.isInteger(b) || b < 0 || b > MAX_BLOCK) continue;
    const k = bkKey(x, y, z); serverSeen.set(k, ts);
    const cur = bk.get(k);
    if (cur === undefined || ts > Math.floor(cur / 64)) { bk.set(k, ts * 64 + b); apply.push([x, y, z, b]); }
  }
  if (apply.length) { applyEdits(apply); bkTouch(); }
}
function bkUpload() {                            // hand over everything the server is missing or has older
  clearInterval(upT);
  const keys = [];
  for (const [k, v] of bk) {
    const ts = Math.floor(v / 64); if (ts < srvReset) continue;
    const seen = serverSeen.get(k); if (seen === undefined || seen < ts) keys.push(k);
  }
  if (!keys.length) return;
  let i = 0; const sock = ws;
  upT = setInterval(() => {
    if (ws !== sock || netState !== 'on' || i >= keys.length) { clearInterval(upT); return; }
    const batch = [];
    for (const k of keys.slice(i, i + 300)) {
      const v = bk.get(k); if (v === undefined) continue;
      const [x, y, z] = bkDecode(k); batch.push([x, y, z, v % 64, Math.floor(v / 64)]);
    }
    i += 300;
    if (batch.length) netSend({ t: 'backup', r: knownReset, e: batch });
  }, 150);
}

function netConnect() {
  if (offlineMode) return;
  const url = netUrl();
  if (!url) { netState = 'off'; netStatus(); return; }
  connectTries++; netState = 'connecting'; netStatus();
  // wake a sleeping Render server (the first request can take up to a minute)
  try { fetch(url.replace(/^ws/, 'http') + '/healthz', { mode: 'no-cors', cache: 'no-store' }).catch(() => {}); } catch (e) {}
  try { ws = new WebSocket(url); } catch (e) { netState = 'off'; netStatus(); clearTimeout(reconnectT); reconnectT = setTimeout(netConnect, 3000); return; }
  const sock = ws;
  setTimeout(() => { if (sock.readyState === 0) { try { sock.close(); } catch (e) {} } }, 20000); // give up after 20s and retry
  ws.onopen = () => {
    netState = 'on'; connectTries = 0; joinMsg = ''; diagKey = '';
    sendHello();                       // auto-join the one shared world
    netStatus();
  };
  ws.onmessage = ev => { let m; try { m = JSON.parse(ev.data); } catch (e) { return; } netHandle(m); };
  ws.onclose = ev => {
    if (ws !== sock) return;
    netState = 'off'; ws = null; onlineCount = 1; clearRemotes(); netStatus();
    if (!offlineMode) { showLobby(); probeServer(); }
    clearTimeout(reconnectT); reconnectT = setTimeout(netConnect, 3000);
  };
  ws.onerror = () => {};
}
function netHandle(m) {
  switch (m.t) {
    case 'err': joinMsg = t('lb_err_' + m.c); renderLobby(); clearTimeout(helloRetryT); helloRetryT = setTimeout(sendHello, 5000); break;   // e.g. world full: try again
    case 'welcome':
      myId = m.id; cycleTime = m.c; applyEdits(m.edits || []);
      for (let i = drops.length - 1; i >= 0; i--) if (drops[i].did) removeDrop(i);                       // shared drops are re-sent by the server
      for (const d of (m.drops || [])) if (Array.isArray(d)) spawnDrop(+d[2], +d[3], +d[4], +d[1], +d[0], +d[5]);
      clockOff = (m.st || Date.now()) - Date.now(); serverSeen.clear(); srvReset = m.r || 0;
      if (srvReset > knownReset) bkDropBefore(srvReset);
      knownReset = Math.max(knownReset, srvReset);
      joinMsg = ''; hideLobby();
      voiceCloseAll(); if (mySkin && mySkin !== 'blue') sendSkin(); heldLocal.sent = -1;
      try { if (localStorage.getItem('sbx_mic') === '1' && !voice.on) voiceToggle(true); } catch (e) {}
      if (m.name) setMyName(m.name);
      adminEnabled = true; isAdmin = false; admStatus();
      if (adminMode) {
        const open = m.admin === 'open';
        el('adm-pw').closest('.setting-row').style.display = open ? 'none' : 'flex';
        if (open) netSend({ t: 'admin', pw: '' });
      }
      for (const p of m.players || []) addRemote(p);
      onlineCount = (m.players || []).length + 1; netStatus(); break;
    case 'join': addRemote(m.p); onlineCount++; netStatus(); break;
    case 'leave': removeRemote(m.id); onlineCount = Math.max(1, onlineCount - 1); netStatus(); break;
    case 'name': { if (m.id === myId) { setMyName(m.name); break; } const r = remotes.get(m.id); if (r) setRemoteName(r, m.name); break; }
    case 'edits': bkFromServer(m.e || []); break;
    case 'synced': bkUpload(); break;
    case 'a': { const k = bkValid(m.x, m.y, m.z) ? bkKey(m.x, m.y, m.z) : -1, cur = bk.get(k); if (cur !== undefined && Number.isFinite(m.ts)) { bk.set(k, m.ts * 64 + (cur % 64)); serverSeen.set(k, m.ts); bkTouch(); } break; }
    case 'drop': spawnDrop(+m.x, +m.y, +m.z, +m.i, +m.did, +m.c); break;
    case 'gone': { const i = drops.findIndex(d => d.did === m.did); if (i >= 0) removeDrop(i); break; }
    case 'got': { const i = drops.findIndex(d => d.did === m.did); if (i >= 0) removeDrop(i); addItem(+m.i, Math.max(1, Math.min(9999, Math.floor(+m.c) || 1))); break; }
    case 'reset': for (let i = drops.length - 1; i >= 0; i--) if (drops[i].did) removeDrop(i); knownReset = srvReset = m.r || Date.now() + clockOff; bk.clear(); serverSeen.clear(); chunkEdits.clear(); reloadWorld(); bkTouch(); break;
    case 'admin': isAdmin = !!m.ok; admStatus(m.ok ? 'adm_ok' : 'adm_bad'); if (m.ok && mySkin === 'blue') sendSkin(); break;
    case 'pos': { const r = remotes.get(m.id); if (r) { r.tx = m.x; r.ty = m.y; r.tz = m.z; r.yaw = m.yaw; r.pitch = Number.isFinite(m.pitch) ? m.pitch : 0; r.hT = Array.isArray(m.h) && m.h.length === 6 && m.h.every(Number.isFinite) ? m.h : null; if (!r.hT) r.hC = null; } break; }
    case 'block': bkFromServer([[m.x, m.y, m.z, m.b, m.ts]]); break;
    case 'time': if (typeof m.c === 'number') cycleTime = m.c; break;
    case 'swing': { const r = remotes.get(m.id); if (r) r.swing = 0.3; break; }
    case 'hit': { const r = remotes.get(m.id); if (r) r.flash = 0.25; break; }
    case 'held': { const r = remotes.get(m.id); if (r) setRemoteHeld(r, +m.i || 0); break; }
    case 'skin': { const r = remotes.get(m.id); if (r) applySkin(r, m.s || null); break; }
    case 'died': { const r = remotes.get(m.id); if (r) { r.dead = true; r.deadT = 0; } break; }
    case 'alive': { const r = remotes.get(m.id); if (r) { r.dead = false; r.deadT = 0; } break; }
    case 'chat': onChat(m); break;
    case 'v': onVoice(m); break;
    case 'hurt': onHurt(m); break;
    case 'ents': onEnts(m); break;
    case 'eown': onEntOwner(m); break;
    case 'edel': onEntsGone(m.o); break;
    case 'ehit': onEntHit(m); break;
  }
}

// apply block edits from the server (also for chunks that are not loaded yet)
function applyEdits(list) {
  const rebuild = new Set();
  for (const e of list) {
    const [x, y, z, b] = e;
    if (!Number.isInteger(x) || !Number.isInteger(y) || !Number.isInteger(z) || !Number.isInteger(b)) continue;
    const ly = y - Y_MIN; if (ly < 0 || ly >= Y_H || b < 0 || b > MAX_BLOCK) continue;
    const cx = x >> 4, cz = z >> 4, key = ckey(cx, cz), idx = (ly * 16 + (z & 15)) * 16 + (x & 15);
    let ed = chunkEdits.get(key); if (!ed) { ed = new Map(); chunkEdits.set(key, ed); }
    ed.set(idx, b);
    const ch = chunks.get(key);
    if (!ch) continue;
    ch.data[idx] = b;
    if (b) { if (ly > ch.top) ch.top = ly; if (ly < ch.bottom) ch.bottom = ly; }
    rebuild.add(ch);
    const lx = x & 15, lz = z & 15;
    const add = (a, c) => { const n = chunks.get(ckey(a, c)); if (n) rebuild.add(n); };
    if (lx === 0) add(cx - 1, cz); if (lx === 15) add(cx + 1, cz);
    if (lz === 0) add(cx, cz - 1); if (lz === 15) add(cx, cz + 1);
  }
  rebuild.forEach(c => buildChunkMesh(c));
}

  updateDrops(dt);
  updateVillagers(dt); netEntsTick(dt); updateCorpses(dt); voiceUpdate(); updateHeldLocal();
  netUpdate(dt);

  // physics blocks
  for (const b of physicsBlocks) {
    b.vel.y = Math.max(b.vel.y - 15 * dt, -40);
    const damp = Math.exp((b.onGround ? -6 : -0.6) * dt);
    b.vel.x *= damp; b.vel.z *= damp;
    const vy = b.vel.y;
    const r = moveEntity(b, dt);
    b.onGround = r.ground;
    if (r.ground && vy < -3) b.vel.y = -vy * 0.3;
    b.mesh.position.set(b.pos.x, b.pos.y + 0.5, b.pos.z);
    if (!b.onGround) { b.mesh.rotation.x += b.vel.z * dt * 0.3; b.mesh.rotation.z -= b.vel.x * dt * 0.3; }
    else { b.mesh.rotation.x *= 0.8; b.mesh.rotation.z *= 0.8; }
  }
  if (physicsBlocks.length > 1) for (let i = 0; i < 2; i++) resolveBlockCollisions();

  renderer.render(scene, camera);
}
update();
</script>
